[project]
name = "core-agent"
version = "0.1.0"
description = "CORE-Harness: 无特权核心分层插件化智能体框架（SDD 规格驱动）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "textual>=0.60",
]

[project.scripts]
core-agent = "core.entry:main"

[project.optional-dependencies]
# 远端 MCP（http/streamable-http）传输的可选依赖（ADR-0043）：仅连远程 MCP 时安装，
# 本地 stdio 走 stdlib 手写，核心运行时保持零第三方依赖（ADR-0044）。
mcp = [
    "mcp>=1",
]
dev = [
    "pytest>=8",
    "pytest-bdd>=7",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "TRY", "PERF", "PLC", "PLR", "C90", "TID"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
