[project]
name = "core-agent"
version = "0.1.0"
description = "CORE-Harness: 无特权核心分层插件化智能体框架（SDD 规格驱动）"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.101.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-bdd>=7",
    "ruff>=0.6",
    "pyright>=1.1",
    "pre-commit>=3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
